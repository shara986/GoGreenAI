# ===========================
# Server Configuration
# ===========================
server.port=${PORT:8081}
server.address=0.0.0.0
server.servlet.context-path=/api

# ===========================
# Database Configuration
# ===========================
spring.datasource.url=jdbc:mysql://localhost:3306/gogreen_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=pujasql@456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===========================
# JPA / Hibernate
# ===========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ===========================
# JWT Configuration
# ===========================
app.jwt.secret=${JWT_SECRET:R29HcmVlbkFJX1N1cGVyU2VjcmV0X0pXVF9LZXlfMjAyNV9DaGFuZ2VUaGlzSW5Qcm9kdWN0aW9uX011c3RCZTI1NkJpdHNMb25nIQ==}
app.jwt.expiration-ms=86400000
app.jwt.refresh-expiration-ms=604800000

# ===========================
# Frontend URL (verification & reset links)
# ===========================
app.frontend.url=${FRONTEND_URL:http://localhost:3000}

# ===========================
# Email Configuration (set MAIL_* env vars in production)
# ===========================
app.mail.enabled=${MAIL_ENABLED:false}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===========================
# Logging
# ===========================
logging.level.com.gogreen=DEBUG
logging.level.org.springframework.security=DEBUG
